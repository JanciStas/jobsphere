# Railway configuration for the JobSphere background WORKER.
#
# The web app runs on Vercel. Vercel cannot host a long-lived process, so the BullMQ
# workers + cron scheduler (apps/web/src/workers/index.ts, started with
# `yarn workers`) are built by Dockerfile.worker and deployed here — see
# remediation/worker-deploy-runbook.md.
#
# (The previous version of this file installed with pnpm and started
# `@jobsphere/api` / `@jobsphere/workers`; those trees are not in the yarn
# workspaces, so the deploy could never have built.)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables (set in the Railway dashboard) — must point at the SAME
# Redis and Postgres as the Vercel deployment:
#   DATABASE_URL
#   REDIS_URL
#   ANTHROPIC_API_KEY / OPENAI_API_KEY (embeddings) / OPENROUTER_API_KEY
#   EMAIL_SERVICE + RESEND_API_KEY or SENDGRID_API_KEY, EMAIL_FROM
#   ENCRYPTION_KEY
