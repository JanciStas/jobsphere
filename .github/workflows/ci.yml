name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  # Every pull request, whatever it targets — not just those aimed at main.
  #
  # The base-branch filter meant a stacked PR got no CI at all. PRs #15, #16 and
  # #18 each target the branch below them rather than main, so the pipeline
  # never ran on any of them: typecheck, lint, tests, coverage, the i18n parity
  # check and the migration drift gate were all silently skipped. GitHub still
  # showed a tick from Vercel and GitGuardian, so the PRs looked checked.
  #
  # That is the same shape as the ESLint ignorePatterns and the unreachable
  # coverage thresholds: a gate that appears to run and does not.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: jobsphere_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Workspace packages (e.g. @jobsphere/ai) emit their dist/ via tsup and are
      # gitignored, so a fresh CI checkout has no build output. apps/web resolves
      # @jobsphere/ai types from ./dist/index.d.ts — build packages BEFORE any
      # typecheck/test/build step or every consumer fails to resolve them (QA-001).
      - name: Build workspace packages
        run: npx turbo run build --filter='./packages/*'

      # Generate the Prisma client so tsc/vitest can resolve @prisma/client types
      # independently of the later build step (which also generates it).
      - name: Generate Prisma client
        run: |
          cd apps/web
          yarn db:generate

      - name: Type check
        run: |
          cd apps/web
          yarn typecheck

      - name: Lint
        run: |
          cd apps/web
          yarn lint

      # The five message catalogs had drifted apart (employer.editJob existed only
      # in en/sk, so /de, /cs and /pl rendered the raw key path "employer.editJob.title"
      # as the page heading). This fails the build if they diverge again.
      - name: Check i18n key parity
        run: node scripts/check-i18n-parity.mjs

      # `yarn test:coverage` is `vitest run --coverage` over the same suite as
      # `yarn test:run` — running both executed every unit test twice. Coverage
      # thresholds are enforced by vitest.config.ts, so this single run gates both.
      - name: Run tests with coverage
        run: |
          cd apps/web
          yarn test:coverage

      # packages/ai and packages/db carry their own vitest suites but had no
      # `test` script, so `turbo test` silently skipped them and they had never
      # run in CI. packages/db self-skips when DATABASE_URL is not local.
      - name: Run workspace package tests
        run: npx turbo run test --filter='./packages/*'

      # Security integration tests (IDOR/multi-tenant/XSS/SQLi) require a live DB.
      # Routed here via vitest.integration.config.ts rather than the unit run so they
      # do not break `yarn test:run` when no DB is present.
      # `migrate deploy`, not `db:push`: the migrations are what create the
      # extensions (vector, pg_trgm, btree_gin, uuid-ossp) and the HNSW indexes,
      # and it is the same command the database-migrations job runs — so CI and a
      # local `yarn test:db:reset` end up with an identical schema.
      - name: Apply database schema (security integration tests)
        run: |
          cd apps/web
          yarn prisma migrate deploy --schema ../../packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'

      # STILL NON-BLOCKING, but the diagnosis has changed.
      #
      # This step never executed at all until 2026-07-29: the coverage step above
      # failed first (80% threshold vs ~20% real coverage), so CI never reached it.
      # Its first real run failed broadly with "Cannot read properties of undefined
      # (reading 'id')", which was read as "the fixtures assume seed data that
      # db:push does not create".
      #
      # That was the wrong cause. beforeAll DOES call seedTestData(). The failure
      # was a race: vitest runs test FILES in parallel by default, all 17 share one
      # fixture organisation, and the global afterAll in tests/integration/setup.ts
      # deletes that organisation — so a finishing file pulled the fixture out from
      # under a running one, the request 4xx'd, and `data.job.id` blew up.
      # vitest.integration.config.ts now sets fileParallelism: false.
      #
      # Kept non-blocking only because that fix has not yet been observed green:
      # it needs a local Docker run (yarn test:db:up) that has not been possible
      # here. Delete continue-on-error once this step passes on its own for a few
      # consecutive runs — not on the first green, so flakes have a chance to show.
      # TODO: verify green locally + 3-5 CI runs, then delete continue-on-error.
      - name: Run security integration tests
        continue-on-error: true
        run: |
          cd apps/web
          yarn test:integration:run
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'
          NEXTAUTH_SECRET: 'test-secret-at-least-32-characters-long'
          NEXTAUTH_URL: 'http://localhost:3000'
          REDIS_URL: 'redis://localhost:6379'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          ANTHROPIC_API_KEY: 'test-key'

      - name: Build
        run: |
          cd apps/web
          yarn build
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'
          NEXTAUTH_SECRET: 'test-secret-at-least-32-characters-long'
          NEXTAUTH_URL: 'http://localhost:3000'
          REDIS_URL: 'redis://localhost:6379'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          NEXT_PUBLIC_API_URL: 'http://localhost:3000/api'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          OPENROUTER_API_KEY: 'test-key'
          ANTHROPIC_API_KEY: 'test-key'
          OPENAI_API_KEY: 'test-key'

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    # Without this the job inherits GitHub's 6-hour default. With workers: 1 and
    # retries, a broadly failing suite grinds through 300 tests x 3 attempts x a
    # 30s timeout and burns most of a day's CI minutes before anyone looks.
    timeout-minutes: 30

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: jobsphere_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Same reason as quality-checks: the Playwright webServer builds apps/web,
      # which imports @jobsphere/ai — build the gitignored package dist first.
      - name: Build workspace packages
        run: npx turbo run build --filter='./packages/*'

      - name: Install Playwright
        run: |
          cd apps/web
          yarn playwright install --with-deps chromium

      - name: Setup test database
        run: |
          cd apps/web
          yarn prisma migrate deploy --schema ../../packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'

      # Build here rather than letting the Playwright webServer do it: the config
      # runs `yarn start` under CI, which needs .next to already exist.
      - name: Build application
        run: |
          cd apps/web
          yarn build:skip-verify
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'
          NEXTAUTH_SECRET: 'test-secret-at-least-32-characters-long'
          NEXTAUTH_URL: 'http://localhost:3000'
          REDIS_URL: 'redis://localhost:6379'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          NEXT_PUBLIC_API_URL: 'http://localhost:3000/api'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          OPENROUTER_API_KEY: 'test-key'
          ANTHROPIC_API_KEY: 'test-key'
          OPENAI_API_KEY: 'test-key'

      # Calls Playwright directly instead of `yarn test:e2e` (which is
      # `turbo test:e2e`). Turborepo 2 defaults to envMode "strict", and the
      # test:e2e task declares only NODE_ENV and DATABASE_URL — so every variable
      # below except DATABASE_URL was being filtered out before it reached the
      # Next server that Playwright starts. Without NEXTAUTH_SECRET the logins in
      # global-setup cannot succeed, which made this job unpassable by
      # construction, independently of the missing browser binaries above.
      - name: Run E2E tests
        run: |
          cd apps/web
          npx playwright test --project=chromium --max-failures=25
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'
          NEXTAUTH_SECRET: 'test-secret-at-least-32-characters-long'
          NEXTAUTH_URL: 'http://localhost:3000'
          REDIS_URL: 'redis://localhost:6379'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          NEXT_PUBLIC_API_URL: 'http://localhost:3000/api'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          OPENROUTER_API_KEY: 'test-key'
          ANTHROPIC_API_KEY: 'test-key'
          OPENAI_API_KEY: 'test-key'
          # CV upload needs both of these or /api/cv/upload can never succeed in
          # CI: without STORAGE_PROVIDER the route tries Vercel Blob with no
          # token and 500s, and securityCheck fails CLOSED on an unreachable
          # ClamAV, rejecting every file as file_malware_detected.
          STORAGE_PROVIDER: 'local'
          ENABLE_ANTIVIRUS: 'false'

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    # The default GITHUB_TOKEN is read-only on modern repos; uploading SARIF to the
    # code-scanning API needs security-events: write or the upload 403s.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Python Parser Docker image
        run: |
          cd docker/python-parser
          docker build -t jobsphere-python-parser .

      # The image's ENTRYPOINT is ["python", "parser.py"] and parser.py requires
      # --file, so a bare `docker run ... python --version` becomes
      # `python parser.py python --version` and argparse exits 2. Override the
      # entrypoint to smoke-test the interpreter.
      - name: Test Python Parser
        run: |
          docker run --rm --entrypoint python jobsphere-python-parser --version

  database-migrations:
    name: Database Migrations Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: jobsphere_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The canonical migration history lives in packages/db/prisma/migrations —
      # point Prisma at that schema explicitly. No `|| echo` fallback: a failing
      # migration must fail the job instead of being reported as success.
      - name: Test Prisma Migrations
        run: |
          cd apps/web
          yarn prisma migrate deploy --schema ../../packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'

      # Prisma resets the shadow database, so it must not be the one we just
      # migrated into.
      - name: Create shadow database for drift check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c 'DROP DATABASE IF EXISTS prisma_shadow' \
            -c 'CREATE DATABASE prisma_shadow'

      # THE POINT OF THIS JOB.
      #
      # "migrate deploy succeeded" only proves the migration files run without
      # erroring on an empty database. It says nothing about whether the result
      # matches schema.prisma — and here it does not. The migrations do not create
      # User.sessionEpoch or Job.country, so an application pointed at a
      # migration-built database dies with P2022 (this is what the E2E job hit).
      #
      # Schema reaches production through `db push` (see deploy.yml and CLAUDE.md),
      # so production has those columns while the migration history does not. That
      # makes this job's green tick meaningless in exactly the way ESLint's
      # ignorePatterns and the unreachable coverage thresholds were: it passes
      # without checking the thing it appears to check.
      #
      # The real cost is not CI. It is that rebuilding from the migration history —
      # disaster recovery, a new environment, a Neon preview branch — produces a
      # database the application cannot use.
      #
      # The gate does not require the diff to be empty — it requires it to equal
      # the documented residual in packages/db/prisma/expected-drift.sql. Prisma
      # 5.22 cannot express `type: Hnsw`, so the two pgvector indexes will always
      # look like drift, and a plain `--exit-code` check could never go green.
      - name: Check migrations reproduce schema.prisma
        run: node scripts/check-migration-drift.mjs
        env:
          SHADOW_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/prisma_shadow'
