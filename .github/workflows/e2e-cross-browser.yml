name: E2E Cross-Browser Tests

# Not on every pull request. This workflow fans out to 19 sharded jobs with a
# 60-minute timeout each; paying that on every push to a PR branch buys little,
# because a cross-browser rendering difference is rarely what a PR breaks. The
# chromium smoke run in ci.yml gates PRs; this gates main.
# Use workflow_dispatch to run it against a branch before merging something
# browser-sensitive (CSS, layout, media queries, date/number formatting).
on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E Tests - ${{ matrix.browser }} (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # `browser` is the `playwright install` target ("edge" is not a valid
        # install target — the channel is called "msedge"); `project` is the
        # matching project name in apps/web/playwright.cross-browser.config.ts,
        # which still calls the msedge project "edge". `install` always includes chromium
        # because tests/setup/global-setup.ts launches chromium for auth state,
        # so every shard needs it regardless of the browser under test.
        browser: [chromium, firefox, webkit, msedge]
        shard: [1/3, 2/3, 3/3]
        include:
          - browser: chromium
            project: chromium
            install: chromium
          - browser: firefox
            project: firefox
            install: firefox chromium
          - browser: webkit
            project: webkit
            install: webkit chromium
          - browser: msedge
            project: edge
            install: msedge chromium

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: jobsphere_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Workspace packages (e.g. @jobsphere/ai) emit their dist/ via tsup and are
      # gitignored, so a fresh CI checkout has no build output. apps/web resolves
      # @jobsphere/ai types from ./dist/index.d.ts — build packages BEFORE any
      # typecheck/test/build step or every consumer fails to resolve them (QA-001).
      - name: Build workspace packages
        run: npx turbo run build --filter='./packages/*'

      - name: Install Playwright browsers
        run: |
          cd apps/web
          npx playwright install --with-deps ${{ matrix.install }}

      - name: Setup test database
        run: |
          cd apps/web
          yarn db:push
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'

      - name: Build application
        run: |
          cd apps/web
          yarn build
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'
          NEXTAUTH_SECRET: 'test-secret-at-least-32-characters-long'
          NEXTAUTH_URL: 'http://localhost:3000'
          REDIS_URL: 'redis://localhost:6379'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          NEXT_PUBLIC_API_URL: 'http://localhost:3000/api'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          OPENROUTER_API_KEY: 'test-key'
          ANTHROPIC_API_KEY: 'test-key'
          OPENAI_API_KEY: 'test-key'
          # /api/cv/upload cannot succeed without these: no blob token -> 500,
          # and the antivirus check fails closed when ClamAV is unreachable.
          STORAGE_PROVIDER: 'local'
          ENABLE_ANTIVIRUS: 'false'
          SKIP_ENV_VALIDATION: 'true'

      - name: Run E2E tests
        run: |
          cd apps/web
          npx playwright test --config=playwright.cross-browser.config.ts --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/jobsphere_test'
          NEXTAUTH_SECRET: 'test-secret-at-least-32-characters-long'
          NEXTAUTH_URL: 'http://localhost:3000'
          REDIS_URL: 'redis://localhost:6379'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          NEXT_PUBLIC_API_URL: 'http://localhost:3000/api'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          OPENROUTER_API_KEY: 'test-key'
          ANTHROPIC_API_KEY: 'test-key'
          OPENAI_API_KEY: 'test-key'
          # /api/cv/upload cannot succeed without these: no blob token -> 500,
          # and the antivirus check fails closed when ClamAV is unreachable.
          STORAGE_PROVIDER: 'local'
          ENABLE_ANTIVIRUS: 'false'
          CI: 'true'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-${{ matrix.browser }}-${{ strategy.job-index }}
          path: apps/web/test-results/**/video.webm
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            apps/web/screenshots/
            apps/web/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}-${{ strategy.job-index }}
          path: apps/web/test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore

